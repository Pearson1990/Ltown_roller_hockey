<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leonardtown Roller Hockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#586A80; --line:#D3DCE6;
  --red:#C42B22; --blue:#1D5FA8; --soft:#E4ECF5; --win:#176B49; --loss:#B3261E;
  --board:#0F1B2D; --board-ink:#F4F7FB; --led:#FFB547; --board-line:#2A3B55;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A111C; --surface:#121D2E; --ink:#E9EFF7; --muted:#98A8BD; --line:#26364C;
    --red:#F0645B; --blue:#6AA7E8; --soft:#1A2A42; --win:#4CC38A; --loss:#F0645B;
    --board:#0D1626; --board-ink:#F4F7FB; --led:#FFB547; --board-line:#2A3B55;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111C; --surface:#121D2E; --ink:#E9EFF7; --muted:#98A8BD; --line:#26364C;
  --red:#F0645B; --blue:#6AA7E8; --soft:#1A2A42; --win:#4CC38A; --loss:#F0645B;
  --board:#0D1626; --board-ink:#F4F7FB; --led:#FFB547; --board-line:#2A3B55;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding-bottom:88px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;margin:0;line-height:1.1;letter-spacing:.2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--blue) 0 34%,var(--red) 34% 66%,var(--blue) 66% 100%)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.top h1{font-size:25px;font-weight:700}
.top .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.upd{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:14px;font-weight:500;white-space:nowrap}
.upd:hover{background:var(--soft)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:13px 2px 12px;font-size:15px;font-weight:500;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--red);border-radius:0 0 3px 3px}
@media (min-width:760px){
  body{padding-bottom:40px}
  .top::after{display:none}
  .top .wrap{flex-wrap:wrap}
  nav.tabs{position:static;display:flex;gap:4px;border:0;padding:0;background:none;width:100%;order:3;max-width:900px;margin:0 auto}
  nav.tabs button{padding:9px 16px 10px;font-size:16px;border-bottom:3px solid transparent}
  nav.tabs button[aria-current="page"]{border-bottom-color:var(--red)}
  nav.tabs button[aria-current="page"]::before{display:none}
  .top .wrap.tabwrap{padding-top:0;padding-bottom:0}
  .top{border-bottom:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(90deg,var(--blue) 0 34%,var(--red) 34% 66%,var(--blue) 66% 100%) border-box}
}
main{padding-top:18px;padding-bottom:20px}
section{margin-top:26px}
section:first-child{margin-top:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sh h2{font-size:23px;font-weight:700}
.more{background:none;border:0;color:var(--blue);font-weight:600;font-size:15px;padding:6px 0}
.more:hover{text-decoration:underline}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;margin-bottom:16px}
.banner button{background:none;border:0;color:var(--blue);font-weight:600;padding:0;text-decoration:underline}

/* team chip */
.chip{--c:#5B6B7A;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font:700 13px/1 'Barlow Condensed','Arial Narrow',sans-serif;flex:none}
.chip.lg{width:46px;height:46px;font-size:25px}
.chip.md{width:34px;height:34px;font-size:19px}
.tlink{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:600;text-align:left}
.tlink:hover .tn{text-decoration:underline}

/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:16px 16px 14px;border:1px solid var(--board-line)}
.board .when{color:#A9B7CC;font-size:14.5px}
.board h2{font-size:34px;font-weight:700;margin-top:2px}
.board .tag{display:inline-block;margin-left:8px;font:600 12.5px 'Barlow',sans-serif;padding:2px 8px;border:1px solid #5B6F8E;border-radius:99px;color:#C8D4E6;vertical-align:middle}
.brow{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--board-line)}
.brow:first-of-type{margin-top:12px}
.bt{white-space:nowrap;font:700 24px/1 'Barlow Condensed','Arial Narrow',sans-serif;color:var(--led);letter-spacing:.5px;font-variant-numeric:tabular-nums}
.bm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-weight:600;font-size:17px}
.bm .tm{display:inline-flex;align-items:center;gap:7px}
.bm i{font-style:normal;color:#8FA1BB;font-weight:400;font-size:14px}
.board .bye{border-top:1px solid var(--board-line);padding-top:10px;color:#A9B7CC;font-size:14.5px}
.board .legend{margin-top:6px;color:#8FA1BB;font-size:13px}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15.5px}
.tbl th{font-weight:600;font-size:13.5px;color:var(--muted);text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:12px;color:var(--muted);width:34px}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td.l{color:var(--ink)}
.tbl td.strong{font-weight:700}
.tbl tr.gap td{color:var(--muted)}
.tbl button.sortb{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:600}
.tbl button.sortb[data-on="1"]{color:var(--ink)}
.tbl button.sortb[data-on="1"]::after{content:attr(data-arrow);margin-left:3px;font-size:11px}
.pbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;text-align:left;display:inline-flex;align-items:center;gap:8px}
.pbtn:hover .pn{text-decoration:underline}
.pteam{color:var(--muted);font-weight:400;font-size:13.5px}
.gtag{font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);margin-left:5px}
.ctag{color:var(--red);border-color:var(--red)}
.f{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:700 12px/1 'Barlow',sans-serif;color:#fff;margin-left:2px}
.f.W{background:var(--win)} .f.L{background:var(--loss)} .f.T{background:#6B7B8F}
.tbl td.form{text-align:left;padding-left:12px}

/* schedule */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:8px 14px;font-size:15px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
select,input[type="search"]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:40px}
input[type="search"]{flex:1 1 180px;min-width:0}
.week{margin-top:20px}
.week:first-of-type{margin-top:0}
.wh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.wh h3{font-size:21px;font-weight:700}
.wh .d{color:var(--muted);font-size:15px}
.wh .tag{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.games{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.game{display:grid;grid-template-columns:84px 1fr;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.game:last-child{border-bottom:0}
.gt{white-space:nowrap;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.gteam{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:2px 0}
.gteam .gs{font:700 20px/1 'Barlow Condensed','Arial Narrow',sans-serif;min-width:24px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.gteam.win .gn{font-weight:700}
.gteam.win .gs{color:var(--ink)}
.gteam.me .gn{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
.refs{color:var(--muted);font-size:13.5px;margin-top:3px}
.byeline{padding:9px 12px;color:var(--muted);font-size:14.5px;border-top:1px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}

/* leaders */
.lgrid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:700px){.lgrid{grid-template-columns:1fr 1fr}}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lcard h3{font-size:20px;font-weight:700;padding:11px 12px 8px}
.lrow{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.lrow:hover{background:var(--soft)}
.lrow .rk{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow .nm{display:flex;align-items:center;gap:8px;min-width:0}
.lrow .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm b{font-weight:600}
.lrow .nm small{color:var(--muted);font-size:13.5px}
.lrow .v{font:700 22px/1 'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
.lcard .foot{padding:8px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}

/* teams */
.tgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (min-width:700px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.tcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tcard:hover{background:var(--soft)}
.tcard .tn{font:700 21px/1.1 'Barlow Condensed','Arial Narrow',sans-serif}
.tcard .meta{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tile b{display:block;font:700 26px/1.05 'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.back{background:none;border:0;color:var(--blue);font-weight:600;padding:4px 0;margin-bottom:10px}
.thead{display:flex;align-items:center;gap:12px}
.thead h2{font-size:32px;font-weight:700}
.thead .meta{color:var(--muted)}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,12,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media (min-width:760px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet .x{float:right;background:var(--soft);border:0;border-radius:8px;padding:6px 12px;font-weight:600}
.sheet h2{font-size:30px;font-weight:700}
.sheet h3{font-size:19px;font-weight:700;margin:18px 0 6px}
.sheet p{margin:8px 0}
.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.status{margin-top:12px;padding:9px 12px;border-radius:9px;font-size:14.5px;background:var(--soft)}
.status.err{background:color-mix(in srgb,var(--loss) 14%,var(--surface));color:var(--ink)}
footer{margin-top:34px;color:var(--muted);font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

  const PAL=['#B3261E','#1D5FA8','#1B7F57','#9A6A12','#6D3A9C','#0B7285','#B83266','#4C5BD4','#5B6B7A','#8A4B1F'];
  const colors={};teams.forEach((t,i)=>colors[t]=PAL[i%PAL.length]);
  // recent form from played games
  const form={};teams.forEach(t=>form[t]=[]);
  weeks.forEach(w=>w.games.forEach(g=>{if(!g.played) return;
    const res=(a,b)=>a>b?'W':a<b?'L':'T';
    if(form[g.home]) form[g.home].push(res(g.hs,g.as)); if(form[g.away]) form[g.away].push(res(g.as,g.hs));}));
  standings.forEach(s=>s.form=(form[s.team]||[]).slice(-5));
  return {captains,league,season,asOf,asOfDate,standings,goalies,players,rosters,weeks,teams,colors,allTime:parseAllTime(roles.alltime)};
}

const SNAP=JSON.parse(document.getElementById('snapshot').textContent);
const KEY='lhl-device-data-v1';
let DATA=null,SOURCE={kind:'published'};
const ui={tab:'home',sched:'upcoming',schedTeam:'all',pview:'leaders',pq:'',pteam:'all',ppos:'all',psort:{k:'pts',dir:-1},
  atq:'',atAll:false,team:null,modal:null,status:null};

function init(){
  const pub=parseAll(mapRoles(SNAP));
  DATA=pub;SOURCE={kind:'published'};
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const o=JSON.parse(raw),d=parseAll(mapRoles(o.sheets));
      if(!pub.asOfDate||(d.asOfDate&&d.asOfDate>=pub.asOfDate)){DATA=d;SOURCE={kind:'device',name:o.name};}
      else localStorage.removeItem(KEY);
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=k=>DATA.captains&&DATA.captains.has(k)?'<span class="gtag ctag" title="Captain">C</span>':'';
const colorOf=t=>(DATA.colors&&DATA.colors[t])||'#5B6B7A';
const chip=(t,sz)=>`<span class="chip${sz?' '+sz:''}" style="--c:${colorOf(t)}" aria-hidden="true">${esc(short(t).charAt(0))}</span>`;
const todayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const fmtDate=(d,long)=>d.toLocaleDateString('en-US',long?{weekday:'long',month:'long',day:'numeric'}:{weekday:'short',month:'short',day:'numeric'});
const signed=n=>n>0?'+'+n:String(n);
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
function daysUntil(d){return Math.round((d-todayStart())/86400000);}
function whenText(d){const n=daysUntil(d);return n===0?'Tonight':n===1?'Tomorrow':n>1?`In ${n} days`:'';}
function nextWeek(){const t=todayStart();return DATA.weeks.find(w=>w.games.length&&w.games.some(g=>!g.played)&&(!w.date||w.date>=t))||null;}
function pendingWeek(){const t=todayStart();const l=DATA.weeks.filter(w=>w.date&&w.date<t&&w.games.length&&w.games.some(g=>!g.played));return l.length?l[l.length-1]:null;}
function lastResultsWeek(){const l=DATA.weeks.filter(w=>w.games.some(g=>g.played));return l.length?l[l.length-1]:null;}
function ranked(rows,f){
  const out=[];let prev=null,rk=0;
  rows.forEach((r,i)=>{const v=f(r);if(v!==prev){rk=i+1;prev=v;}out.push({r,rk,v});});
  const cnt={};out.forEach(x=>cnt[x.rk]=(cnt[x.rk]||0)+1);
  out.forEach(x=>x.tied=cnt[x.rk]>1);
  return out;
}
function topN(key,n){
  const rows=DATA.players.filter(p=>p[key]>0).sort((a,b)=>b[key]-a[key]||b.pts-a.pts||b.g-a.g||a.name.localeCompare(b.name));
  const rk=ranked(rows,r=>r[key]),shown=rk.slice(0,n);
  const cut=shown.length?shown[shown.length-1].v:null;
  const extra=cut==null?0:rk.slice(n).filter(x=>x.v===cut).length;
  return {shown,extra};
}
function topGoalies(n){
  const rows=DATA.goalies.filter(g=>g.gp>0).sort((a,b)=>a.gaa-b.gaa||b.w-a.w||a.name.localeCompare(b.name));
  return ranked(rows,r=>r.gaa.toFixed(2)).slice(0,n);
}

/* ---------- pieces ---------- */
function gameRow(g,hl){
  const w=g.played?(g.hs>g.as?'h':g.as>g.hs?'a':''):'';
  const line=(t,sc,win)=>`<div class="gteam${win?' win':''}${hl===t?' me':''}">${chip(t)}<span class="gn">${esc(short(t))}</span><span class="gs">${g.played?sc:''}</span></div>`;
  return `<div class="game"><div class="gt">${esc(fmtTime(g.time))}${g.ot?`<div class="refs" style="font-weight:600">Final/${esc(g.ot)}</div>`:''}</div><div>${line(g.home,g.hs,w==='h')}${line(g.away,g.as,w==='a')}${g.refs?`<div class="refs">Refs: ${esc(g.refs)}</div>`:''}</div></div>`;
}
function weekBlock(w,team){
  const games=team?w.games.filter(g=>g.home===team||g.away===team):w.games;
  const bye=w.byes.length&&(!team||w.byes.includes(team));
  if(!games.length&&!bye) return '';
  const date=w.date?fmtDate(w.date):'Date to be announced';
  return `<div class="week"><div class="wh"><h3>${esc(w.label)}</h3><span class="d">${esc(date)}</span>${w.tentative?'<span class="tag">Draft schedule</span>':''}</div>
  <div class="games">${games.map(g=>gameRow(g,team)).join('')}${bye?`<div class="byeline">Bye: ${w.byes.map(b=>esc(short(b))).join(', ')}</div>`:''}</div></div>`;
}
function scoreboard(w){
  const when=w.date?`${esc(whenText(w.date))}`:'';
  return `<section class="board" aria-label="Next game night">
    <div class="when">Next game night${when?' · '+when:''}</div>
    <h2>${w.date?esc(fmtDate(w.date,true)):esc(w.label)}${w.tentative?'<span class="tag">Draft schedule</span>':''}</h2>
    ${w.games.map(g=>`<div class="brow"><span class="bt">${esc(fmtTime(g.time))}</span><span class="bm"><span class="tm">${chip(g.home)}${esc(short(g.home))}</span><i>vs</i><span class="tm">${chip(g.away)}${esc(short(g.away))}</span></span></div>`).join('')}
    ${w.byes.length?`<div class="bye">Bye: ${w.byes.map(b=>esc(short(b))).join(', ')}</div>`:''}
    <div class="legend">${esc(w.label)} · first team listed is home (white jerseys)</div>
  </section>`;
}
function formDots(f){return f.length?f.map(x=>`<span class="f ${x}" title="${x==='W'?'Win':x==='L'?'Loss':'Tie'}">${x}</span>`).join(''):'<span class="pteam">No games yet</span>';}
function standCompact(){
  return `<div class="tw"><table class="tbl"><thead><tr><th>#</th><th class="l">Team</th><th>GP</th><th>W-L-T</th><th>Pts</th><th>GD</th></tr></thead><tbody>
  ${DATA.standings.map(s=>`<tr><td>${s.rank}</td><td class="l"><button class="tlink" data-act="team" data-team="${esc(s.team)}">${chip(s.team)}<span class="tn">${esc(short(s.team))}</span></button></td><td>${s.gp}</td><td>${s.w}-${s.l}-${s.t}</td><td class="strong">${s.pts}</td><td>${signed(s.gd)}</td></tr>`).join('')}</tbody></table></div>`;
}
function standFull(){
  return `<div class="tw"><table class="tbl"><thead><tr><th>#</th><th class="l">Team</th><th>GP</th><th>W</th><th>L</th><th>T/OTL</th><th>Pts</th><th>GD</th><th>GF</th><th>GA</th><th class="l">Last 5</th></tr></thead><tbody>
  ${DATA.standings.map(s=>`<tr><td>${s.rank}</td><td class="l"><button class="tlink" data-act="team" data-team="${esc(s.team)}">${chip(s.team)}<span class="tn">${esc(short(s.team))}</span></button></td><td>${s.gp}</td><td>${s.w}</td><td>${s.l}</td><td>${s.t}</td><td class="strong">${s.pts}</td><td>${signed(s.gd)}</td><td>${s.gf}</td><td>${s.ga}</td><td class="form">${formDots(s.form)}</td></tr>`).join('')}</tbody></table></div>
  <p class="note">Win = 2 points, tie or overtime loss = 1 point. Teams are ordered by points, then wins, goal differential, goals for, goals against.</p>`;
}
function goalieTable(){
  const gs=DATA.goalies.slice().sort((a,b)=>(a.gp>0?0:1)-(b.gp>0?0:1)||(a.gaa==null?1:a.gaa)-(b.gaa==null?1:b.gaa)||b.w-a.w||a.name.localeCompare(b.name));
  return `<div class="tw"><table class="tbl"><thead><tr><th>#</th><th class="l">Goalie</th><th>GP</th><th>W</th><th>L</th><th>GA</th><th>GAA</th></tr></thead><tbody>
  ${gs.map((g,i)=>`<tr${g.gp?'':' class="gap"'}><td>${g.gp?i+1:''}</td><td class="l"><button class="pbtn" data-act="player" data-key="${esc(g.key)}">${chip(g.team)}<span><span class="pn">${esc(g.name)}</span>${cap(g.key)} <span class="pteam">${esc(short(g.team))}</span></span></button></td><td>${g.gp}</td><td>${g.w}</td><td>${g.l}</td><td>${g.ga}</td><td class="strong">${g.gaa==null?'–':g.gaa.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`;
}
function leaderCard(title,list,unit,extra){
  return `<div class="lcard"><h3>${esc(title)}</h3>${list.length?list.map(x=>`<button class="lrow" data-act="player" data-key="${esc(x.r.key)}"><span class="rk">${x.tied?'T-':''}${x.rk}</span><span class="nm">${chip(x.r.team)}<span class="t"><b>${esc(x.r.name)}</b>${cap(x.r.key)} <small>${esc(short(x.r.team))}</small></span></span><span class="v">${unit(x)}</span></button>`).join(''):'<div class="foot">Nothing to show yet.</div>'}${extra>0?`<div class="foot">+${extra} more tied for last place</div>`:''}</div>`;

    return `<div class="ov" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="Update data" data-stop="1"><button class="x" data-act="close">Close</button><h2>Update data</h2>
    <p>Choose the latest weekly spreadsheet from your league organizer (.xlsx). The stats, schedule, and rosters update right away.</p>
    <p style="color:var(--muted);font-size:14.5px">This changes what you see on this device only. Other people keep seeing the published numbers until the page itself is updated.</p>
    <p><label class="btn primary">Choose spreadsheet<input class="vh" id="file" type="file" accept=".xlsx,.xlsm,.xls"></label>
    ${SOURCE.kind==='device'?` <button class="btn" data-act="reset">Use published data</button>`:''}</p>
    ${st?`<div class="status ${st.kind==='err'?'err':''}" role="status">${esc(st.msg)}</div>`:''}
    <p style="color:var(--muted);font-size:14px">Currently showing: ${SOURCE.kind==='device'?esc(SOURCE.name||'uploaded file'):'published data'}${DATA.asOf?', stats as of '+esc(DATA.asOf):''}.</p></div></div>`;
  }
  const p=DATA.players.find(x=>x.key===ui.modal.key)||DATA.goalies.map(g=>({key:g.key,name:g.name,team:g.team,goalie:true,gp:g.gp,g:0,a:0,pim:0,pts:0,ppg:0,weekly:[],gk:g})).find(x=>x.key===ui.modal.key);
  if(!p) return '';
  const career=DATA.allTime.find(r=>r.name.toLowerCase()===p.name.toLowerCase());
  return `<div class="ov" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(p.name)}" data-stop="1"><button class="x" data-act="close">Close</button>
  <h2>${esc(p.name)}${cap(p.key)}${p.goalie?'<span class="gtag">G</span>':''}</h2>
  <p><button class="tlink" data-act="team" data-team="${esc(p.team)}">${chip(p.team)}<span class="tn">${esc(p.team)}</span></button></p>
  <div class="tiles"><div class="tile"><b>${p.gp}</b><span>Games</span></div><div class="tile"><b>${p.g}</b><span>Goals</span></div><div class="tile"><b>${p.a}</b><span>Assists</span></div><div class="tile"><b>${p.pts}</b><span>Points</span></div><div class="tile"><b>${p.pim}</b><span>Penalty min</span></div></div>
  ${p.gk?`<h3>Goalie record</h3><div class="tiles"><div class="tile"><b>${p.gk.w}-${p.gk.l}-${p.gk.t}</b><span>W-L-T</span></div><div class="tile"><b>${p.gk.ga}</b><span>Goals against</span></div><div class="tile"><b>${p.gk.gaa==null?'–':p.gk.gaa.toFixed(2)}</b><span>GAA</span></div></div>`:''}
  <h3>This season, week by week</h3>
  ${p.weekly&&p.weekly.length?`<div class="tw"><table class="tbl"><thead><tr><th></th><th class="l">Week</th><th>G</th><th>A</th><th>Pts</th><th>PIM</th></tr></thead><tbody>${p.weekly.map(w=>`<tr><td></td><td class="l">Week ${w.week}</td><td>${w.g}</td><td>${w.a}</td><td class="strong">${w.pts}</td><td>${w.pim}</td></tr>`).join('')}</tbody></table></div>`:'<p style="color:var(--muted)">No games played yet.</p>'}
  ${career?`<h3>Career totals</h3><div class="tiles"><div class="tile"><b>${career.gp}</b><span>Games</span></div><div class="tile"><b>${career.g}</b><span>Goals</span></div><div class="tile"><b>${career.a}</b><span>Assists</span></div><div class="tile"><b>${career.pts}</b><span>Points</span></div><div class="tile"><b>${career.pim}</b><span>Penalty min</span></div></div>`:''}
  </div></div>`;
}
function shell(){
  const tabs=[['home','Home'],['schedule','Schedule'],['standings','Standings'],['players','Players'],['teams','Teams']];
  const body={home:vHome,schedule:vSchedule,standings:vStandings,players:vPlayers,teams:vTeams}[ui.tab]();
  return `<header class="top"><div class="wrap"><div><h1>${esc(DATA.league)}</h1><div class="sub">${esc(DATA.season)}${DATA.asOf?' · stats as of '+esc(DATA.asOf):''}</div></div><button class="upd" data-act="openupdate">Update data</button></div>
  <nav class="tabs" aria-label="Sections">${tabs.map(t=>`<button data-act="tab" data-tab="${t[0]}"${ui.tab===t[0]?' aria-current="page"':''}>${t[1]}</button>`).join('')}</nav></header>
  <main class="wrap">${body}<footer>Numbers come from the league organizer's weekly spreadsheet.</footer></main>${modal()}`;
}
function render(){
  const app=document.getElementById('app'),ae=document.activeElement,fid=ae&&ae.id,ss=ae&&ae.selectionStart;
  app.innerHTML=shell();
  document.body.style.overflow=ui.modal?'hidden':'';
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss);}catch(e){}}}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.classList.contains('ov')&&e.target.closest('[data-stop]')) return;
  const a=t.dataset.act;
  if(a==='tab'){ui.tab=t.dataset.tab;ui.modal=null;if(ui.tab!=='teams')ui.team=null;window.scrollTo(0,0);}
  else if(a==='sched') ui.sched=t.dataset.mode;
  else if(a==='pview') ui.pview=t.dataset.v;
  else if(a==='sort'){const k=t.dataset.k;ui.psort=ui.psort.k===k?{k,dir:-ui.psort.dir}:{k,dir:k==='name'?1:-1};}
  else if(a==='player') ui.modal={type:'player',key:t.dataset.key};
  else if(a==='team'){ui.team=t.dataset.team;ui.tab='teams';ui.modal=null;window.scrollTo(0,0);}
  else if(a==='teamsback'){ui.team=null;window.scrollTo(0,0);}
  else if(a==='close'){ if(t.classList.contains('ov')&&e.target!==t) return; ui.modal=null; }
  else if(a==='openupdate'){ui.status=null;ui.modal={type:'update'};}
  else if(a==='atall') ui.atAll=true;
  else if(a==='reset'){try{localStorage.removeItem(KEY);}catch(err){} init(); ui.status={kind:'ok',msg:'Back to the published data.'};}
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render();}});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='pq'){ui.pq=e.target.value;render();}
  else if(id==='atq'){ui.atq=e.target.value;render();}
});
document.addEventListener('change',async e=>{
  const t=e.target,id=t.id;
  if(id==='schedTeam'){ui.schedTeam=t.value;render();}
  else if(id==='pteam'){ui.pteam=t.value;render();}
  else if(id==='ppos'){ui.ppos=t.value;render();}
  else if(id==='file'){
    const f=t.files&&t.files[0]; if(!f) return;
    try{
      if(!window.XLSX) throw new Error('The spreadsheet reader could not load. Check your connection and try again.');
      const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),sheets={};
      wb.SheetNames.forEach(n=>{if(roleOf(n)) sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});});
      const parsed=parseAll(mapRoles(sheets));
      DATA=parsed;SOURCE={kind:'device',name:f.name};
      try{localStorage.setItem(KEY,JSON.stringify({name:f.name,savedAt:Date.now(),sheets}));}catch(err){}
      ui.team=null;ui.status={kind:'ok',msg:'Loaded '+f.name+(parsed.asOf?'. Stats as of '+parsed.asOf+'.':'.')};
    }catch(err){ui.status={kind:'err',msg:'Could not read that file. '+(err&&err.message?err.message:'')};}
    render();
  }
});

init();
render();
</script>
</body>
</html>
